<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>School Ends Countdown</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: black;
        color: white;
        height: 100vh;
    }

    /* =========================
       START SCREEN
    ========================= */
    #start-screen {
        position: fixed;
        inset: 0;
        background: url("startbg.png") center center / cover no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        cursor: pointer;
        transition: opacity 0.8s ease;
    }

    #start-screen.hidden {
        opacity: 0;
        pointer-events: none;
    }

    .start-text {
        font-size: 4.5rem;
        font-weight: bold;
        text-align: center;
        padding: 40px;
        text-shadow:
            0 0 10px black,
            0 0 25px black,
            0 0 50px black;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.03); }
        100% { transform: scale(1); }
    }

    /* =========================
       MAIN WEBSITE
    ========================= */

    #main-content {
        display: none;
    }

    /* Background Videos */
    .bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2;
    }

    /* Overlay */
    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: -1;
    }

    /* Main Container */
    .container {
        position: relative;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
    }

    h1 {
        font-size: 4rem;
        margin-bottom: 10px;
        text-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    .credits {
        font-size: 1rem;
        opacity: 0.5;
        margin-bottom: 30px;
        letter-spacing: 1px;
    }

    #countdown {
        display: flex;
        gap: 20px;
        margin-bottom: 50px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .time-box {
        background: rgba(255,255,255,0.12);
        padding: 20px;
        border-radius: 15px;
        min-width: 120px;
        backdrop-filter: blur(6px);
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    .number {
        font-size: 3rem;
        font-weight: bold;
    }

    .label {
        font-size: 1rem;
        opacity: 0.8;
        margin-top: 5px;
    }

    /* Oi Hughie Corner */
    .oi-corner {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .oi-title {
        font-size: 2rem;
        margin-bottom: 15px;
        text-shadow: 0 0 15px black;
    }

    .spin-image {
        width: 180px;
        height: 180px;
        animation: spin 6s linear infinite;
        object-fit: contain;
    }

    @keyframes spin {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
    }

    /* =========================
       END SCREEN
    ========================= */

    #end-screen {
        position: fixed;
        inset: 0;
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 5000;
    }

    #end-video {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2;
    }

    .end-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.35);
        z-index: -1;
    }

    .hooray-text {
        font-size: 7rem;
        font-weight: bold;
        text-shadow:
            0 0 20px black,
            0 0 40px black,
            0 0 80px black;
        animation: pulse 2s infinite;
    }

    @media (max-width: 700px) {
        .start-text {
            font-size: 2.2rem;
        }

        h1 {
            font-size: 2.5rem;
        }

        .number {
            font-size: 2rem;
        }

        .time-box {
            min-width: 90px;
            padding: 15px;
        }

        .spin-image {
            width: 130px;
            height: 130px;
        }

        .hooray-text {
            font-size: 4rem;
        }
    }
</style>
</head>
<body>

<!-- =========================
     START SCREEN
========================= -->
<div id="start-screen">
    <div class="start-text">
        excuse me sir,<br>
        press here to start,<br>
        capiche?
    </div>
</div>

<!-- =========================
     MAIN WEBSITE
========================= -->
<div id="main-content">

    <!-- Main Background Video -->
    <video autoplay muted loop playsinline class="bg-video" id="main-video">
        <source src="lebackground.mp4" type="video/mp4">
    </video>

    <!-- Music -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="overlay"></div>

    <div class="container">
        <h1>school ends in:</h1>
        <div class="credits">(made by cools and le chat gpt)</div>

        <div id="countdown">
            <div class="time-box">
                <div class="number" id="days">0</div>
                <div class="label">Days</div>
            </div>

            <div class="time-box">
                <div class="number" id="hours">0</div>
                <div class="label">Hours</div>
            </div>

            <div class="time-box">
                <div class="number" id="minutes">0</div>
                <div class="label">Minutes</div>
            </div>

            <div class="time-box">
                <div class="number" id="seconds">0</div>
                <div class="label">Seconds</div>
            </div>
        </div>

        <!-- Oi Hughie Corner -->
        <div class="oi-corner">
            <div class="oi-title">oi hughie corner</div>
            <img src="oihughie.png" alt="Spinning Image" class="spin-image">
        </div>
    </div>
</div>

<!-- =========================
     END SCREEN
========================= -->
<div id="end-screen">

    <video autoplay muted loop playsinline id="end-video">
        <source src="endbg.mp4" type="video/mp4">
    </video>

    <div class="end-overlay"></div>

    <div class="hooray-text">
        hooray
    </div>

</div>

<script>
    // =========================
    // START SCREEN
    // =========================
    const startScreen = document.getElementById("start-screen");
    const mainContent = document.getElementById("main-content");
    const music = document.getElementById("bg-music");

    startScreen.addEventListener("click", () => {

        // Show website
        mainContent.style.display = "block";

        // Fade start screen away
        startScreen.classList.add("hidden");

        // Start music
        music.play().catch(err => {
            console.log("Music blocked:", err);
        });

        // Remove start screen after fade
        setTimeout(() => {
            startScreen.style.display = "none";
        }, 800);
    });

    // =========================
    // COUNTDOWN
    // =========================
    const targetDate = new Date("May 20, 2026 15:00:00").getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const distance = targetDate - now;

        // TIMER ENDED
        if (distance <= 0) {

            // Hide main content
            mainContent.style.display = "none";

            // Show end screen
            document.getElementById("end-screen").style.display = "flex";

            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = days;
        document.getElementById("hours").innerText = hours;
        document.getElementById("minutes").innerText = minutes;
        document.getElementById("seconds").innerText = seconds;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>

</body>
</html>
